# Auth endpoints are the credential-guessing surface: 10 requests/minute per client address.
# This file is included inside nginx's `http` block, so the zone can be declared here.
# $remote_addr is the real client only while this container is the edge; behind another
# load balancer, restore it first (realip module) or every user shares one bucket.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Security headers live at server level only, and no location below uses add_header: nginx
    # drops inherited add_header lines in any location that declares its own, which would
    # silently strip these. Cache lifetimes therefore use `expires`, which is not affected.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # style-src needs 'unsafe-inline' because MUI/emotion inject <style> tags at runtime and the
    # built index.html carries one inline <style>. Scripts stay strictly same-origin, and fonts
    # are self-hosted (@fontsource), so font-src falls back to default-src 'self'.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Enable once TLS terminates at this server (or add it at the TLS-terminating proxy).
    # Sending it over plain http is ignored by browsers and, once cached, locks users out.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Same-origin API keeps auth cookies first-party. X-Forwarded-For is overwritten with the
    # address nginx actually saw, never appended to: a client-supplied value must not reach the
    # API, whose rate limits and logs trust it (uvicorn --forwarded-allow-ips).
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # The API repeats these headers; hide its copy so clients see exactly one.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 60s;
    }

    # File names are content-hashed, so a year-long cache is safe.
    location /assets/ {
        expires 1y;
    }

    # SPA routes fall back to index.html, which must always be revalidated.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
