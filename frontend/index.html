<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StockEye – plain-English stock analysis</title>
    <meta
      name="description"
      content="StockEye reads the news and the chart for US and Singapore stocks and explains what it found in plain words."
    />
    <meta property="og:title" content="StockEye – plain-English stock analysis" />
    <meta
      property="og:description"
      content="StockEye reads the news and the chart for US and Singapore stocks and explains what it found in plain words."
    />
    <style>
      /* Clickjacking guard for hosts that cannot send frame-ancestors: the bundle (frameGate.ts)
         reveals the page only when it is the top-level window. */
      html {
        visibility: hidden;
      }
      /* Paint the right background before the JS bundle loads, so dark mode never flashes white. */
      html {
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #000;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
