# Local production-like stack: MongoDB + API + web (nginx serving the SPA and proxying /api).
# For MongoDB Atlas, drop the `mongo` service and set STOCKEYE_MONGODB_URI=mongodb+srv://...
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    environment:
      STOCKEYE_MONGODB_URI: mongodb://mongo:27017
      STOCKEYE_JWT_SECRET: ${STOCKEYE_JWT_SECRET:?set STOCKEYE_JWT_SECRET}
      STOCKEYE_COOKIE_SECURE: ${STOCKEYE_COOKIE_SECURE:-true}
      STOCKEYE_CORS_ORIGINS: '["http://localhost:8080"]'
      STOCKEYE_FINNHUB_API_KEY: ${STOCKEYE_FINNHUB_API_KEY:-}
      STOCKEYE_MARKETAUX_API_KEY: ${STOCKEYE_MARKETAUX_API_KEY:-}
      STOCKEYE_ALPHAVANTAGE_API_KEY: ${STOCKEYE_ALPHAVANTAGE_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
