# Production stack on the Oracle VM. Installed to /opt/stockeye/ by setup-vm.sh and always run
# through `stockeye-compose`, which passes the two env files below:
#   /etc/stockeye/stockeye.env  secrets and settings (root:root 0600, filled in by hand)
#   /etc/stockeye/state.env     API_IMAGE=<ghcr digest ref>, written only by deploy.sh
# Compose reads them for ${...} interpolation. The API gets an explicit list of variables, so the
# MongoDB root password never enters the API container.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.11@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.29.0.2
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE:?API_IMAGE is written by deploy.sh; run the Deploy workflow}
    restart: unless-stopped
    logging: *logging
    environment:
      STOCKEYE_MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?}:${MONGO_APP_PASSWORD:?}@mongo:27017/stockeye?authSource=stockeye
      STOCKEYE_JWT_SECRET: ${STOCKEYE_JWT_SECRET:?set STOCKEYE_JWT_SECRET}
      STOCKEYE_CORS_ORIGINS: ${STOCKEYE_CORS_ORIGINS:?set STOCKEYE_CORS_ORIGINS}
      STOCKEYE_FINNHUB_API_KEY: ${STOCKEYE_FINNHUB_API_KEY:-}
      STOCKEYE_MARKETAUX_API_KEY: ${STOCKEYE_MARKETAUX_API_KEY:-}
      STOCKEYE_ALPHAVANTAGE_API_KEY: ${STOCKEYE_ALPHAVANTAGE_API_KEY:-}
      # uvicorn believes X-Forwarded-* only from Caddy's pinned address on the edge network.
      FORWARDED_ALLOW_IPS: 172.29.0.2
    networks:
      edge: {}
      data: {}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # No healthcheck here on purpose: the image's HEALTHCHECK (backend/Dockerfile) is the single
    # definition: HTTP 200 from /api/health AND database == ok. deploy.sh gates on it.
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    # MongoDB 7.0, not 8.x: 8.0+ refuses to start on Linux kernels 6.19-7.0.13 (SERVER-121912). Ubuntu's Oracle
    # kernel reports itself as 7.0.0-*, so even 8.0.30+ (which allows 7.0.14+) won't start. 7.0 is unaffected.
    # 7.0 security support ends August 2027: revisit then (docs/DEPLOY.md, "Maintenance").
    image: mongo:7.0@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    restart: unless-stopped
    logging: *logging
    # No `ports:`. Auth is on because MONGO_INITDB_ROOT_* makes the image start with --auth.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./10-app-user.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    networks:
      data: {}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # The entrypoint starts as root to chown the volume, then drops to the mongodb user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  # edge: Caddy and the API (needs outbound internet: ACME, market-data providers).
  edge:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  # data: API and MongoDB only, with no route off the host.
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.29.1.0/24

volumes:
  caddy-data:
  caddy-config:
  mongo-data:
  mongo-config:
