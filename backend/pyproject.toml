[project]
name = "stockeye-backend"
version = "0.1.0"
description = "StockEye API: macro and technical analysis of US and SGX stocks"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "pymongo>=4.15",
    "httpx>=0.28",
    "tenacity>=9.1",
    "yfinance>=0.2.66",
    "feedparser>=6.0",
    "pandas>=2.3",
    "numpy>=2.3",
    "scipy>=1.16",
    "exchange-calendars>=4.11",
    "onnxruntime>=1.23",
    "tokenizers>=0.22",
    "huggingface-hub>=0.35",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "apscheduler>=3.11,<4",
    "structlog>=25.4",
    "limits>=3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "hypothesis>=6.140",
    "time-machine>=2.19",
    "asgi-lifespan>=2.1",
    "ruff>=0.13",
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "import-linter>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "S", "PTH", "C4", "PL", "TRY", "DTZ"]
ignore = [
    "PLR0913",  # analysis functions legitimately take several tuning parameters
    "TRY003",   # descriptive exception messages are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "feedparser.*", "exchange_calendars.*", "onnxruntime.*", "apscheduler.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs a running MongoDB (STOCKEYE_MONGODB_URI)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O layers"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.services", "app.repositories", "app.providers", "app.jobs", "app.db", "pymongo", "httpx", "yfinance"]

[[tool.importlinter.contracts]]
name = "Admin can never reach watchlists"
type = "forbidden"
source_modules = ["app.api.admin"]
forbidden_modules = ["app.repositories.watchlists", "app.api.watchlist"]
# AccountService.delete_user cascades a delete of the owner's watchlist document; the admin
# router itself must never import the watchlist module directly.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layering"
type = "layers"
layers = [
    "app.main",
    "app.api : app.jobs : app.cli",
    "app.services : app.auth",
    "app.repositories : app.providers : app.sentiment",
    "app.domain",
]
