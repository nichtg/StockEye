name: backend

# No `paths:` filter: a required status check from a path-filtered workflow never reports on PRs
# that do not touch those paths, which would block them from merging. Main is covered by
# backend-image.yml, which runs the same gates before building the image.
on:
  pull_request:

permissions: {}

jobs:
  backend:
    permissions:
      contents: read
    uses: ./.github/workflows/backend-gates.yml
