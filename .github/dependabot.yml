version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # MongoDB 8.x refuses to start on the production VM's kernel (see deploy/compose.yml and
    # docs/DEPLOY.md, "Maintenance"); stay on 7.0 until that is resolved.
    ignore:
      - dependency-name: mongo
        versions: [">= 8.0"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # MongoDB 8.x refuses to start on the production VM's kernel (see deploy/compose.yml and
    # docs/DEPLOY.md, "Maintenance"); stay on 7.0 until that is resolved.
    ignore:
      - dependency-name: mongo
        versions: [">= 8.0"]
